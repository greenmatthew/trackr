# Serves the published Blazor WebAssembly app and reverse-proxies the API, so the
# browser sees a single origin. That is what lets the app use a plain HttpOnly
# session cookie rather than a token (CLAUDE.md section 3).
#
# Installed as /etc/nginx/conf.d/default.conf, i.e. inside the stock http block -
# which is why the map below is legal here.

# Preserve the scheme the *browser* used, not the one this container was reached on.
# The user's own reverse proxy terminates TLS and then talks to us over plain http,
# so a flat `X-Forwarded-Proto $scheme` would tell the backend "http" and every
# generated link - password reset, invite - would come out as http:// on an https
# site. Only fall back to $scheme when nothing upstream set the header.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # `dotnet publish` emits pre-compressed .gz siblings; gzip_static serves them
    # directly instead of compressing on every request.
    gzip             on;
    gzip_static      on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css application/javascript application/json
                     application/wasm image/svg+xml application/manifest+json;

    # Meal photos start flowing through here in milestone 6; the default 1m is
    # too small for a phone camera image.
    client_max_body_size 25m;

    # Container healthcheck only. Not proxied, not logged.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        # $http_host rather than $host: it passes the Host header through verbatim,
        # port included. $host drops the port, which turns a link generated on
        # http://localhost:8000 into http://localhost.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Connection        "";

        # A CPU-bound local vision model can take a while to answer (milestone 5).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Every file .NET 10 publishes under _framework/ carries a content fingerprint
    # in its name (dotnet.native.u31nt9bth6.wasm, blazor.webassembly.<hash>.js, and
    # so on), so a changed file is always a changed URL. There is no stable-named
    # boot manifest to exempt - index.html itself, served no-cache below, is what
    # points at the current fingerprints.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx's stock mime.types has no .webmanifest entry, so it would otherwise go
    # out as application/octet-stream and browsers may refuse to install the PWA.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything else - index.html, the service worker, icons - plus the SPA
    # fallback so deep links work. Deliberately no-cache: this is how a client
    # notices a new deployment, and a stale service worker pins users to an old
    # build. Revalidation is cheap next to that failure mode.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
