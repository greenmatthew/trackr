# Local development stack. Standalone - use it on its own, not as an override:
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# (Compose merges networks additively, so an override file could not drop the
# external `proxy` network that docker-compose.yml declares. Two self-contained
# files cost a little duplication and give a dev stack that runs anywhere.)
#
# Ports are published to the host so they can be curled directly, and the
# credentials below are throwaway. Never point this at real data.

name: trackr-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: trackr
      POSTGRES_USER: trackr
      POSTGRES_PASSWORD: trackr_dev
    ports:
      # 5433 on the host, to stay clear of any local Postgres on 5432. This is
      # also what appsettings.Development.json points at for the `dotnet watch`
      # loop, where this is the only container running.
      - "5433:5432"
    volumes:
      # Postgres 18 data lives under /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackr -d trackr"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ..
      dockerfile: src/Trackr.Api/Dockerfile
    image: trackr-backend:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development, but the connection string here overrides the one in
      # appsettings.Development.json - inside the network the database is `db`.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Trackr: Host=db;Port=5432;Database=trackr;Username=trackr;Password=trackr_dev
      Trackr__Ollama__BaseAddress: http://ollama:11434/
      # A much smaller model than the deployment stack's, because this one has to be pulled and
      # loaded on a development machine rather than a server. granite3.2-vision is 2.4 GB and was
      # built for pulling text out of tables and charts, which is what a nutrition panel is - so it
      # is a fair test of the pipeline even though a bigger model reads labels better.
      #
      # It is a different model family from the deployment default, so a prompt quirk can hide
      # here. The photo runs in wiki/Ollama-Setup.md are done against the deployed model for that
      # reason.
      Trackr__Ollama__Model: ${TRACKR_OLLAMA_MODEL:-granite3.2-vision:2b}
      # 16K is this model's entire window, which one photo plus the instructions needs.
      Trackr__Ollama__ContextLength: 16384
    ports:
      - "8080:8080"

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      # Named, so `server.sh reset` can drop the database without re-downloading the model.
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama ps || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      # Published so a candidate model can be pulled and prodded directly with curl while
      # testing one, which is the experiment wiki/Ollama-Setup.md asks for.
      - "11434:11434"

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${TRACKR_OLLAMA_MODEL:-granite3.2-vision:2b}"]

  frontend:
    build:
      context: ..
      dockerfile: src/Trackr.Web/Dockerfile
    image: trackr-frontend:dev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The whole app, same-origin, exactly as it behaves in production.
      - "8000:80"

volumes:
  db-data:
  ollama-models:
